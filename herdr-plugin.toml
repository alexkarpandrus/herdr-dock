id = "herdr-dock"
name = "herdr-dock"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Create coordinated Herdr workspaces across multiple repositories"
platforms = ["linux", "macos"]

[[build]]
command = ["cargo", "build", "--release"]
platforms = ["linux", "macos"]

[[actions]]
id = "create"
title = "Create dock"
contexts = ["global"]
command = ["target/release/herdr-dock", "open", "create"]

[[actions]]
id = "overview"
title = "Dock overview"
contexts = ["global"]
command = ["target/release/herdr-dock", "open", "overview"]

[[panes]]
id = "create"
title = "Create dock"
placement = "popup"
width = "80%"
height = "80%"
command = ["sh", "-c", 'exec "$HERDR_PLUGIN_ROOT/target/release/herdr-dock" create']

[[panes]]
id = "overview"
title = "Dock overview"
placement = "popup"
width = "80%"
height = "80%"
command = ["sh", "-c", 'exec "$HERDR_PLUGIN_ROOT/target/release/herdr-dock" overview']
